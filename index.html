<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="description"
          content="A devotional collection of bhajans and devotional songs.">

    <title>Bhajan Book</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="book">

        <div class="outer-frame">

            <!-- =========================================
                 TOP
            ========================================== -->

            <header class="top-section">

                <div class="photo-box small-photo">
                    <img src="images/top-left.jpg.jpeg"
                         alt="Devotional image">
                </div>


                <div class="om-section">

                    <div class="ornament-line">
                        <span></span>
                        <span></span>
                    </div>

                    <div class="om-symbol">
                        ॐ
                    </div>

                    <div class="ornament-line">
                        <span></span>
                        <span></span>
                    </div>

                </div>


                <div class="photo-box small-photo">
                    <img src="images/top-right.jpg.jpeg"
                         alt="Devotional image">
                </div>

            </header>


            <!-- =========================================
                 TITLE
            ========================================== -->

            <section class="title-section">

                <div class="title-box">

                    <h1>
                        Title of the webpage
                    </h1>

                </div>

            </section>


            <!-- =========================================
                 CENTER PHOTO
            ========================================== -->

            <section class="center-section">

                <div class="center-photo">

                    <img src="images/center.jpg.jpeg"
                         alt="Main devotional image">

                </div>

            </section>


            <!-- =========================================
                 QUOTE
            ========================================== -->

            <section class="quote-section">

                <div class="decorative-divider">
                    ✦
                </div>

                <p>
                    Some good quote<br>
                    about devotion or bhajans
                </p>

                <div class="decorative-divider">
                    ✦
                </div>

            </section>


            <!-- =========================================
                 ENTER
            ========================================== -->

            <section class="enter-section">

                <button
                    id="enterButton"
                    class="enter-button">

                    Enter
                    <span>→</span>

                </button>

            </section>


            <!-- =========================================
                 TALA
            ========================================== -->

            <section class="tala-section">

                <img src="images/tala.png.png"
                     alt="Tala">

                <img src="images/tala.png.png"
                     alt="Tala">

            </section>


            <!-- =========================================
                 BOTTOM ORNAMENT
            ========================================== -->

            <div class="bottom-decoration">
                ❖
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
