<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A devotional collection of bhajans and devotional songs.">

    <title>Bhajan Book</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="book">

        <!-- Decorative outer frame -->
        <div class="outer-frame">

            <!-- Top section -->
            <header class="top-section">

                <div class="photo-box small-photo">
                    <img src="images/top-left.jpg"
                         alt="Devotional image">
                </div>

                <div class="om-section">

                    <div class="ornament-line">
                        <span></span>
                        <span></span>
                    </div>

                    <div class="om-symbol">ॐ</div>

                    <div class="ornament-line">
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="photo-box small-photo">
                    <img src="images/top-right.jpg"
                         alt="Devotional image">
                </div>

            </header>


            <!-- Title -->
            <section class="title-section">

                <div class="title-arch">

                    <h1>Title of the webpage</h1>

                </div>

            </section>


            <!-- Center image -->
            <section class="center-section">

                <div class="center-photo">

                    <img src="images/center.jpg"
                         alt="Main devotional image">

                </div>

            </section>


            <!-- Quote -->
            <section class="quote-section">

                <div class="decorative-divider">
                    ✦
                </div>

                <p>
                    Some good quote<br>
                    about devotion or bhajans
                </p>

                <div class="decorative-divider">
                    ✦
                </div>

            </section>


            <!-- Enter button -->
            <section class="enter-section">

                <button id="enterButton" class="enter-button">
                    Enter
                    <span>→</span>
                </button>

            </section>


            <!-- Tala / devotional instrument -->
            <section class="tala-section">

                <img src="images/tala.png"
                     alt="Tala">

                <img src="images/tala.png"
                     alt="Tala">

            </section>


            <!-- Bottom decoration -->
            <div class="bottom-decoration">
                ❖
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
